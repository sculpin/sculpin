php-version: 8.5
extensions: "ctype,dom,fileinfo,filter,iconv,json,libxml,mbstring,pcntl,pdo,phar,posix,tokenizer,xmlwriter"
sapi:
    - micro
download-options:
    parallel: 6
    retry: 5
    prefer-binary: true
build-options:
    with-suggests: false
    no-strip: true
extra-env:
    SPC_DEFAULT_CFLAGS: "-Oz -fPIC -ffunction-sections -fdata-sections -g"
    SPC_DEFAULT_CXXFLAGS: "-Oz -fPIC -ffunction-sections -fdata-sections"
    SPC_DEFAULT_LDFLAGS: "-Wl,--gc-sections"

#  with-hardcoded-ini:
#    - "memory_limit=8G"

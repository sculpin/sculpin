name: Build Linux Binary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-linux-musl
          - arch: x86_64
            target: arm-linux-musleabihf
          - arch: x86_64
            target: x86_64-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Compile ${{ matrix.arch }} binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/docker-static-build.sh "${{ matrix.target }}"

      - name: Verify ${{ matrix.target }} binary
        run: |
          f="build/sculpin-${{ matrix.target }}"
          file "$f"
          # x86_64 isn't valid, replace with x86-64
          file "$f" | grep -iqw "$(echo '${{ matrix.target }}' | cut -d- -f1 | tr _ -)"
          if [ "${{ matrix.arch }}" = "$(uname -m)" ]; then
            docker run --rm -v "$PWD/build:/b" alpine:3.24 "/b/$(basename "$f")" --version
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
            name: sculpin-bin-linux-${{ matrix.arch }}
            path: build/sculpin-${{ matrix.target }}
            retention-days: 30

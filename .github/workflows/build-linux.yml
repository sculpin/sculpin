name: Build Linux Binary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - 3.3.x-dev
      - 4.0.x-dev
      - 4.1.x-dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-musl
            platform: linux/arm64
          - target: arm-linux-musleabihf
            platform: linux/arm/v7
          - target: x86_64-linux-musl
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Compile ${{ matrix.target }} binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/docker-static-build.sh "${{ matrix.target }}"

      - name: Upload logs if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
            name: sculpin-logs-${{ matrix.target }}
            path: logs
            retention-days: 30
            if-no-files-found: ignore

      - name: Verify ${{ matrix.target }} binary
        run: |
          f="build/sculpin-${{ matrix.target }}"
          file "$f"
          # x86_64 isn't valid, replace with x86-64
          file "$f" | grep -iqw "$(echo '${{ matrix.target }}' | cut -d- -f1 | tr _ -)"
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$PWD/build:/b" alpine:3.24 "/b/$(basename "$f")" --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
            name: sculpin-bin-linux-${{ matrix.target }}
            path: build/sculpin-${{ matrix.target }}
            retention-days: 30
